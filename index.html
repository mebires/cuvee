<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#0a0a0a;color:#ede7db;font-family:-apple-system,sans-serif;max-width:500px;margin:0 auto;padding-bottom:72px;min-height:100vh}
input{background:#111;border:.5px solid #222;border-radius:10px;padding:10px 14px;color:#ede7db;font-size:14px;width:100%;outline:none}
button{cursor:pointer;border:none;background:none;color:inherit;font-family:inherit}
.pills{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{padding:6px 14px;border-radius:20px;font-size:12px;white-space:nowrap;border:.5px solid #222;color:#666;background:#111;flex-shrink:0}
.pill.on{background:#ede7db;color:#0a0a0a;border-color:#ede7db}
.card{background:#111;border:.5px solid #1e1e1e;border-radius:12px;padding:12px 14px;margin-bottom:8px}
.stat{background:#111;border:.5px solid #222;border-radius:12px;padding:14px 16px}
.stat .v{font-size:26px;font-weight:300;letter-spacing:-1px}
.stat .l{font-size:10px;color:#555;letter-spacing:2px;margin-top:2px}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:500px;background:#0a0a0a;border-top:.5px solid #151515;display:flex;padding:4px 0 20px}
.navbtn{flex:1;padding:8px 0;font-size:9px;letter-spacing:1px;color:#444;border-top:1.5px solid transparent;text-align:center}
.navbtn.on{color:#ede7db;border-top-color:#ede7db}
.navbtn .ic{font-size:16px;margin-bottom:2px}
.hdr{padding:24px 20px 14px;border-bottom:.5px solid #151515;display:flex;justify-content:space-between;align-items:baseline}
.sec{padding:0 20px}
.lbl{font-size:10px;color:#444;letter-spacing:2px;margin:16px 0 8px;display:block}
.flag{font-size:10px;color:#888;background:#1a1a1a;padding:2px 7px;border-radius:10px;border:.5px solid #2a2a2a;margin:2px 2px 0 0;display:inline-block}
.wdot{width:6px;height:6px;border-radius:50%;flex-shrink:0;margin-top:2px}
.detail-overlay{position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:100;overflow-y:auto;padding:20px}
.star{font-size:20px;cursor:pointer;color:#333;padding:4px}
.star.on{color:#ede7db}
.bal-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:.5px solid #151515}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:7px}
.bar-track{flex:1;height:3px;background:#1a1a1a;border-radius:2px;overflow:hidden}
.bar-fill{height:3px;border-radius:2px}
</style>

function haversine(lat1,lng1,lat2,lng2) {
  const R=3959, dLat=(lat2-lat1)*Math.PI/180, dLng=(lng2-lng1)*Math.PI/180;
  const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

// Score a retail item against the collector's profile
function scoreItem(item) {
  const [name, region, vintage, price, market, colour] = item;
  const disc = Math.round((market-price)/market*100);
  const allP = [...PRIO_BURG, ...PRIO_PIED];
  const isPriority = allP.some(p=>name.includes(p));
  const isNatural = NATURAL.some(p=>name.includes(p));
  const pv = PRIO_VIN[region] || [];
  const isPrioVintage = pv.includes(vintage);
  const owned = state.cellar.filter(w=>w[I.N].toLowerCase().split(" ").slice(0,3).join(" ")===name.toLowerCase().split(" ").slice(0,3).join(" "));
  const ownQty = owned.reduce((s,w)=>s+w[I.Q],0);
  const ownsVintage = owned.some(w=>w[I.V]===vintage);
  
  let score = 0;
  let reasons = [];
  if (isPriority) { score+=40; reasons.push("Priority producer"); }
  if (isNatural) { score+=15; reasons.push("Natural producer"); }
  if (isPrioVintage) { score+=15; reasons.push("Priority vintage"); }
  if (disc>=25) { score+=30; reasons.push(disc+"% below market"); }
  else if (disc>=15) { score+=15; reasons.push(disc+"% below market"); }
  if (ownQty>0 && !ownsVintage) { score+=10; reasons.push("Fills vintage gap"); }
  if (ownQty===0 && isPriority) { score+=15; reasons.push("Not in cellar"); }
  if (ownsVintage) { score-=20; reasons.push("Already own "+ownQty+"bt"); }
  
  return { name, region, vintage, price, market, colour, disc, score, reasons, isPriority, isNatural, ownQty, ownsVintage };
}

function flags(w) {
  const f = [];
  if (w[I.V] === BIRTH) f.push("🎂 1983");
  const allP = [...PRIO_BURG, ...PRIO_PIED];
  if (allP.some(p => w[I.N].includes(p))) f.push("⭐ Priority");
  if (NATURAL.some(p => w[I.N].includes(p))) f.push("🌿 Natural");
  const pv = PRIO_VIN[w[I.R]] || [];
  if (pv.includes(w[I.V])) f.push("✦ " + w[I.V]);
  if (w[I.N].toLowerCase().includes("grand cru")) f.push("👑 GC");
  return f;
}

function totalBt() { return state.cellar.reduce((s,w)=>s+w[I.Q],0); }
function totalVal() { return state.cellar.reduce((s,w)=>s+w[I.P]*w[I.Q],0); }
function byRegion(r) { return state.cellar.filter(w=>w[I.R]===r).reduce((s,w)=>s+w[I.Q],0); }
function byWindow(wn) { return state.cellar.filter(w=>w[I.W]===wn).reduce((s,w)=>s+w[I.Q],0); }
function gcBt() { return state.cellar.filter(w=>w[I.N].toLowerCase().includes("grand cru")).reduce((s,w)=>s+w[I.Q],0); }

function filtered() {
  return state.cellar.filter(w => {
    if (state.fRegion !== "All" && w[I.R] !== state.fRegion) return false;
    if (state.fWindow !== "All" && w[I.W] !== state.fWindow) return false;
    if (state.fColour !== "All" && w[I.C] !== state.fColour) return false;
    if (state.fStatus === "in" && !inHand(w)) return false;
    if (state.fStatus === "pending" && inHand(w)) return false;
    if (state.search && !w[I.N].toLowerCase().includes(state.search.toLowerCase()) && !w[I.V].includes(state.search)) return false;
    return true;
  }).sort((a,b) => {
    const d = state.sortDir==="desc" ? 1 : -1;
    if (state.sort==="vintage") return d * b[I.V].localeCompare(a[I.V]);
    if (state.sort==="value") return d * ((b[I.P]*b[I.Q])-(a[I.P]*a[I.Q]));
    if (state.sort==="price") return d * (b[I.P]-a[I.P]);
    if (state.sort==="name") return a[I.N].localeCompare(b[I.N]);
    return a[I.R].localeCompare(b[I.R]) || a[I.N].localeCompare(b[I.N]);
  });
}

            <span style="font-size:12px;color:#aaa;min-width:84px">${r}</span>
            <div class="bar-track"><div class="bar-fill" style="width:${Math.round(n/burg*100)}%;background:${c}"></div></div>
            <span style="font-size:11px;color:#444;min-width:28px;text-align:right">${n}</span>
          </div>`;
        }).join("")}
      </div>

      <span class="lbl">COLLECTION BALANCE</span>
      <div style="background:#111;border-radius:12px;padding:14px 16px;margin-bottom:20px;border:.5px solid #1a1a1a">
        ${[
          ["Burgundy share", Math.round(burg/tb*100)+"%", "40–50%", burg/tb > 0.35],
          ["Piedmont share", Math.round(pied/tb*100)+"%", "25–35%", pied/tb > 0.2],
          ["Grand Cru ratio", gcPct+"%", ">30%", gcPct >= 30],
          ["Drink now pressure", dn+"bt", "<150bt", dn < 150],
        ].map(([l,v,t,ok])=>`
          <div class="bal-row">
            <span style="font-size:12px;color:#888">${l}</span>
            <div>
              <span style="font-size:13px;color:${ok?"#5dbf7a":"#e2884a"}">${v}</span>
              <span style="font-size:10px;color:#333;margin-left:6px">target ${t}</span>
            </div>
          </div>`).join("")}
      </div>

      <span class="lbl">OPEN SOON</span>
      <div style="background:#111;border-radius:12px;padding:12px 16px;border:.5px solid #2a1010;margin-bottom:20px">
        ${state.cellar.filter(w=>w[I.W]==="Drink now"&&w[I.C]==="Red"&&inHand(w)).sort((a,b)=>a[I.V].localeCompare(b[I.V])).slice(0,6).map(w=>`
          <div onclick="openDetail(${w[I.ID]})" style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:.5px solid #151515;cursor:pointer">
            <span style="font-size:12px;color:#ccc;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-right:8px">${w[I.N]}</span>

          </div>`).join("")}
      </div>`;
  }

  // ── CELLAR ──
  else if (state.tab === "cellar") {
    const regions = ["All", ...new Set(state.cellar.map(w=>w[I.R]))];
    const windows = ["All","Drink now","Drink soon","Cellar","Hold 10+ yrs"];
    const sorts = [["region","Region"],["name","Name"],["vintage","Vintage"],["value","Value"],["price","Price/bt"]];
    const fil = filtered();

    main.innerHTML = `
      <div style="height:14px"></div>
      <input placeholder="Search producer, vintage..." value="${state.search}" oninput="setSearch(this.value)" style="margin-bottom:10px">
      <div class="pills" style="margin-bottom:8px">
        ${regions.map(r=>`<button class="pill ${state.fRegion===r?'on':''}" onclick="setFR('${r}')">${r}</button>`).join("")}
      </div>
      <div class="pills" style="margin-bottom:8px">
        <button class="pill ${state.fStatus==='All'?'on':''}" onclick="state.fStatus='All';render()">All bottles</button>
        <button class="pill ${state.fStatus==='in'?'on':''}" onclick="state.fStatus='in';render()">In hand</button>
        <button class="pill ${state.fStatus==='pending'?'on':''}" onclick="state.fStatus='pending';render()">Pending / storage</button>
      </div>
      <div class="pills" style="margin-bottom:8px">
        <button class="pill ${state.fColour==='All'?'on':''}" onclick="setFC('All')">All</button>
        ${Object.entries(CC).map(([c,cfg])=>{
          const n = byColour(c);
          if (!n) return "";
          return `<button class="pill ${state.fColour===c?'on':''}" onclick="setFC('${c}')" style="${state.fColour===c?`background:${cfg.c};border-color:${cfg.c};color:#0a0a0a`:''}">${c}</button>`;
        }).join("")}
      </div>
      <div class="pills" style="margin-bottom:8px">
        ${windows.map(w=>`<button class="pill ${state.fWindow===w?'on':''}" onclick="setFW('${w.replace(/'/g,"\'")}')">${w}</button>`).join("")}
      </div>
      <div class="pills" style="margin-bottom:12px">
        ${sorts.map(([v,l])=>{
          const active = state.sort===v;
          const dirArrow = (v==="vintage"||v==="value"||v==="price") && active ? (state.sortDir==="desc" ? " ↓" : " ↑") : "";
          return `<button class="pill ${active?'on':''}" onclick="setSort('${v}')">${l}${dirArrow}</button>`;
        }).join("")}
      </div>
      <div style="font-size:11px;color:#666;margin-bottom:10px">${fil.length} wines · ${fil.reduce((s,w)=>s+w[I.Q],0)} bottles</div>
      <div id="wine-list"></div>`;

    const list = main.querySelector("#wine-list");
    fil.forEach(w => {
      const rc = RC[w[I.R]] || "#666";
      const fl = flags(w);
      const wc = WC[w[I.W]] || WC["Cellar"];
      const el = document.createElement("div");
      el.className = "card";
      el.style.borderLeft = `2px solid ${rc}`;
      el.style.cursor = "pointer";
      el.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
          <div style="flex:1;min-width:0">
            <div style="font-size:13px;color:#ede7db;font-weight:500;line-height:1.3;margin-bottom:4px">${w[I.N]}</div>
            <div style="font-size:11px;color:#555">${w[I.V]} <span style="color:#444">·</span> <span style="color:${rc}">${w[I.R]}</span>${w[I.S]!=="750ml"?` <span style="font-size:10px;color:#444;background:#1a1a1a;padding:1px 5px;border-radius:3px">${w[I.S]}</span>`:""}${!inHand(w)?` <span style="font-size:10px;color:${w[I.ST]==='storage'?'#4a9fe2':'#ef9f27'};background:#1a1a1a;padding:1px 6px;border-radius:3px">${w[I.ST]==='storage'?'Parcelle storage':(STATUS_NOTE[w[I.ID]]||'pending')}</span>`:""}</div>
            ${fl.length?`<div style="margin-top:5px">${fl.map(f=>`<span class="flag">${f}</span>`).join("")}</div>`:""}
          </div>
          <div style="text-align:right;flex-shrink:0">
            <div style="font-size:13px;font-weight:500;color:${wc.tx}">×${w[I.Q]}</div>
            <div style="font-size:11px;color:#777;margin-top:2px">$${w[I.P].toLocaleString()}</div>
            <div style="width:6px;height:6px;border-radius:50%;background:${wc.tx};margin-left:auto;margin-top:6px"></div>
          </div>
        </div>`;
      el.onclick = () => openDetail(w[I.ID]);
      list.appendChild(el);
    });
  }

  // ── INTELLIGENCE ──
  else if (state.tab === "intel") {
    if (state.intelMode==="score"||state.intelMode==="market") { main.innerHTML = intelPills() + (state.intelMode==="score"?scoreView():marketView()); } else {
    const by83 = state.cellar.filter(w=>w[I.V]===BIRTH);
    const gaps = [
      ["DRC", w => w[I.N].includes("Romanee-Conti") || w[I.N].includes("DRC")],
      ["Leroy Grand Cru", w => w[I.N].includes("Leroy") && w[I.N].toLowerCase().includes("grand cru")],
      ["Roumier Bonnes-Mares", w => w[I.N].includes("Roumier") && w[I.N].includes("Bonnes")],
      ["Mugnier Musigny", w => w[I.N].includes("Mugnier") && w[I.N].includes("Musigny")],
      ["Giuseppe Rinaldi", w => w[I.N].toLowerCase().includes("rinaldi")],
      ["Liger-Belair La Romanée", w => w[I.N].includes("Liger") && w[I.N].includes("Roman")],
      ["Aldo Conterno Granbussia", w => w[I.N].includes("Aldo Conterno")],
    ];

    const dn = byWindow("Drink now");
    const gcP = Math.round(gcBt()/totalBt()*100);
    const piedP = Math.round(byRegion("Piedmont")/totalBt()*100);

    main.innerHTML = intelPills() + `
      <div style="height:16px"></div>
      
      <span class="lbl">🎂 BIRTH YEAR — 1983</span>
      <div style="background:#111;border-radius:12px;padding:12px 16px;border:.5px solid #1a1a1a;margin-bottom:20px">
        ${by83.length===0 ? '<div style="font-size:12px;color:#333">None in cellar</div>' :
          by83.map(w=>`<div onclick="openDetail(${w[I.ID]})" style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:.5px solid #151515;cursor:pointer">
            <span style="font-size:12px;color:#ccc">${w[I.N]}</span>
            <span style="font-size:12px;color:#ede7db">×${w[I.Q]}</span>
          </div>`).join("")}
      </div>

      <span class="lbl">PRIORITY GAPS</span>
      <div style="background:#111;border-radius:12px;padding:12px 16px;border:.5px solid #1a1a1a;margin-bottom:20px">
        ${gaps.map(([name, fn]) => {
          const n = state.cellar.filter(fn).reduce((s,w)=>s+w[I.Q],0);
          const col = n===0?"#e24b4a":n<3?"#ef9f27":"#5dbf7a";
          return `<div class="bal-row">
            <span style="font-size:12px;color:#999">${name}</span>
            <span style="font-size:13px;color:${col}">${n===0?"None":n+"bt"}</span>
          </div>`;
        }).join("")}
      </div>

      <span class="lbl">BUYING ADVICE</span>
      <div style="background:#111;border-radius:12px;padding:14px 16px;border:.5px solid #1a1a1a;margin-bottom:20px">
        ${[
          [gcP < 30, "🔴", `Grand Cru ratio is ${gcP}% — below 30% target. Grand Crus only until it improves.`],
          [gcP >= 30, "🟢", `Grand Cru ratio is ${gcP}% — on target. 1er Cru exceptions permitted for priority producers.`],
          [piedP > 30, "🟡", `Piedmont is ${piedP}% of cellar. Ease Piedmont buying pace for now.`],
          [dn > 130, "🟡", `${dn} bottles in Drink Now. Open 2–3 per week.`],
          [true, "🔵", "Leroy Grand Cru and Roumier Bonnes-Mares remain highest priority Burgundy gaps."],
          [true, "🔵", "Giuseppe Rinaldi is the most urgent Piedmont gap."],
        ].filter(([show])=>show).map(([,ic,msg])=>`
          <div style="display:flex;gap:10px;padding:8px 0;border-bottom:.5px solid #151515">
            <span style="flex-shrink:0">${ic}</span>
            <span style="font-size:12px;color:#aaa;line-height:1.5">${msg}</span>
          </div>`).join("")}
      </div>

      <span class="lbl">NATURAL PRODUCERS</span>
      <div style="background:#111;border-radius:12px;padding:12px 16px;border:.5px solid #1a1a1a;margin-bottom:20px">
        ${state.cellar.filter(w=>NATURAL.some(p=>w[I.N].includes(p))).map(w=>`
          <div onclick="openDetail(${w[I.ID]})" style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:.5px solid #151515;cursor:pointer">
            <span style="font-size:12px;color:#ccc">${w[I.N]} <span style="color:#444">${w[I.V]}</span></span>
            <span style="font-size:12px;color:#5dbf7a">×${w[I.Q]}</span>
          </div>`).join("")}
      </div>`;
  }}


  // ── NEARBY ──
  else if (state.tab === "nearby") {
    const hasGeo = state.userLat !== null;
    const shops = RETAILERS.map(r => ({
      ...r,
      dist: hasGeo ? haversine(state.userLat, state.userLng, r.lat, r.lng) : null,
      scored: r.inv.map(scoreItem).sort((a,b)=>b.score-a.score)
    })).sort((a,b) => hasGeo ? a.dist-b.dist : 0);

    // Top picks across all shops
    const allPicks = shops.flatMap(s => s.scored.map(item => ({...item, shop:s.name, shopId:s.id, dist:s.dist})))
      .filter(i => i.score > 0).sort((a,b)=>b.score-a.score).slice(0,8);

    let content = `<div style="height:14px"></div>`;

    // Geo status bar
    content += `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <div style="font-size:11px;color:#666">${hasGeo ? "📍 Showing shops near you" : state.geoStatus==="loading" ? "Locating..." : state.geoStatus==="denied" ? "Location denied — showing NYC" : "Showing NYC retailers"}</div>
      ${!hasGeo && state.geoStatus!=="loading" ? `<button onclick="requestGeo()" style="font-size:11px;color:#4a9fe2;padding:4px 10px;border:.5px solid #4a9fe2;border-radius:12px">Use my location</button>` : ""}
    </div>`;

    // Demo notice
    content += `<div style="background:#1a1a0a;border:.5px solid #4a4a10;border-radius:8px;padding:8px 12px;margin-bottom:14px;font-size:11px;color:#8a8a40">Demo inventory — live retailer feeds require Wine-Searcher API integration</div>`;

    // View toggle
    content += `<div class="pills" style="margin-bottom:14px">
      <button class="pill ${state.nearbyView==='picks'?'on':''}" onclick="state.nearbyView='picks';state.nearbyShop=null;render()">Top Picks</button>
      <button class="pill ${state.nearbyView==='shops'?'on':''}" onclick="state.nearbyView='shops';state.nearbyShop=null;render()">By Shop</button>
    </div>`;

    if (state.nearbyView === "picks") {
      content += `<span class="lbl">RECOMMENDED FOR YOU</span>`;
      allPicks.forEach(p => {
        const cc = CC[p.colour] || {c:"#666"};
        content += `<div class="card" style="border-left:2px solid ${cc.c}">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
            <div style="flex:1;min-width:0">
              <div style="font-size:13px;color:#ede7db;font-weight:500;line-height:1.3;margin-bottom:3px">${p.name}</div>
              <div style="font-size:11px;color:#555;margin-bottom:5px">${p.vintage} · ${p.shop}${p.dist!==null?` · ${p.dist.toFixed(1)} mi`:""}</div>
              <div>${p.reasons.map(r=>`<span class="flag" style="${r.includes('Already')?'color:#e24b4a;border-color:#4a1010':r.includes('below')?'color:#5dbf7a;border-color:#1a4a1a':''}">${r}</span>`).join("")}</div>
            </div>
            <div style="text-align:right;flex-shrink:0">
              <div style="font-size:14px;color:#ede7db;font-weight:500">$${p.price}</div>
              <div style="font-size:10px;color:#555;text-decoration:line-through">$${p.market}</div>
              <div style="font-size:11px;color:${p.disc>=25?'#5dbf7a':p.disc>=15?'#ef9f27':'#666'};margin-top:2px">${p.disc}% off</div>
            </div>
          </div>
        </div>`;
      });
    } else {
      if (state.nearbyShop) {
        const s = shops.find(x=>x.id===state.nearbyShop);
        content += `<button onclick="state.nearbyShop=null;render()" style="color:#666;font-size:12px;margin-bottom:12px">← All shops</button>
          <div style="font-size:16px;color:#ede7db;margin-bottom:2px">${s.name}</div>
          <div style="font-size:11px;color:#555;margin-bottom:4px">${s.addr}${s.dist!==null?` · ${s.dist.toFixed(1)} mi`:""}</div>
          <div style="font-size:11px;color:#777;margin-bottom:16px">${s.spec}</div>`;
        s.scored.forEach(p => {
          const cc = CC[p.colour] || {c:"#666"};
          content += `<div class="card" style="border-left:2px solid ${cc.c}">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
              <div style="flex:1;min-width:0">
                <div style="font-size:13px;color:#ede7db;line-height:1.3;margin-bottom:3px">${p.name}</div>
                <div style="font-size:11px;color:#555;margin-bottom:4px">${p.vintage}</div>
                <div>${p.reasons.map(r=>`<span class="flag" style="${r.includes('Already')?'color:#e24b4a;border-color:#4a1010':r.includes('below')?'color:#5dbf7a;border-color:#1a4a1a':''}">${r}</span>`).join("")}</div>
              </div>
              <div style="text-align:right;flex-shrink:0">
                <div style="font-size:14px;color:#ede7db">$${p.price}</div>
                <div style="font-size:11px;color:${p.disc>=25?'#5dbf7a':p.disc>=15?'#ef9f27':'#666'}">${p.disc}% off</div>
              </div>
            </div>
          </div>`;
        });
      } else {
        shops.forEach(s => {
          const topPick = s.scored[0];
          const goodCount = s.scored.filter(i=>i.score>=40).length;
          content += `<div class="card" onclick="state.nearbyShop='${s.id}';render()" style="cursor:pointer">
            <div style="display:flex;justify-content:space-between;align-items:flex-start">
              <div style="flex:1;min-width:0">
                <div style="font-size:14px;color:#ede7db;font-weight:500;margin-bottom:2px">${s.name}</div>
                <div style="font-size:11px;color:#555;margin-bottom:6px">${s.addr}${s.dist!==null?` · ${s.dist.toFixed(1)} mi`:""}</div>
                <div style="font-size:11px;color:#777;line-height:1.4">${s.spec}</div>
              </div>
              <div style="text-align:right;flex-shrink:0;margin-left:10px">
                <div style="font-size:18px;color:${goodCount>=3?'#5dbf7a':goodCount>=1?'#ef9f27':'#555'};font-weight:300">${goodCount}</div>
                <div style="font-size:9px;color:#444;letter-spacing:1px">PICKS</div>
              </div>
            </div>
            ${topPick && topPick.score>=40 ? `<div style="margin-top:10px;padding-top:10px;border-top:.5px solid #1a1a1a;font-size:11px;color:#888">Top: <span style="color:#ccc">${topPick.name} ${topPick.vintage}</span> · <span style="color:#5dbf7a">$${topPick.price}</span></div>` : ""}
          </div>`;
        });
      }
    }
    main.innerHTML = content;
  }


  // ── RADAR ──
  else if (state.tab === "radar") {
    const groups = {};
    const list = state.radarMode==="natural" ? RADAR.filter(x=>x.nat) : RADAR;
    list.forEach(x => { (groups[x.r] = groups[x.r] || []).push(x); });
    let out = `<div style="height:16px"></div>
      <div style="display:flex;gap:6px;margin-bottom:10px">${[["all","All"],["natural","Natural"]].map(([k,l])=>`<button onclick="state.radarMode='${k}';render()" style="padding:5px 12px;border-radius:14px;font-size:10px;letter-spacing:1px;text-transform:uppercase;background:${(state.radarMode||'all')===k?'#ede7db':'#111'};color:${(state.radarMode||'all')===k?'#0a0a0a':'#666'};border:.5px solid #222">${l}</button>`).join("")}</div>
      <div style="font-size:11px;color:#555;margin-bottom:14px;line-height:1.5">${state.radarMode==="natural"?"Natural & low-intervention producers — the emerging list. Each shows where it actually turns up: auction, retail, restaurant. Scanned on every catalogue.":"Producers to track. Flagged automatically when they appear in auction or retail lists."}</div>`;
    const order = ["Burgundy","Piedmont","Tuscany","Umbria","Sicily","Jura","California"];
    order.forEach(reg => {
      if (!groups[reg]) return;
      out += `<span class="lbl">${reg.toUpperCase()}</span>`;
      groups[reg].sort((a,b)=>({buying:0,tasted:1,taste:2}[a.s]-{buying:0,tasted:1,taste:2}[b.s])).forEach(x => {
        const st = RADAR_STATUS[x.s];
        out += `<div class="card" style="border-left:2px solid ${st.c}">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
            <div style="flex:1;min-width:0">
              <div style="font-size:13px;color:#ede7db;font-weight:500;margin-bottom:3px">${x.p}</div>
              <div style="font-size:11px;color:#777;line-height:1.5">${x.note}</div>
              ${x.look?`<div style="font-size:10px;color:#5dbf7a;margin-top:4px">◎ ${x.look}</div>`:""}
              ${x.wines?`<div style="font-size:11px;color:#c9a84c;margin-top:4px">${x.wines}${x.where?` — ${x.where}`:""}</div>`:""}
            </div>
            <div style="text-align:right;flex-shrink:0">
              <div style="font-size:10px;color:${st.c};letter-spacing:1px">${st.l.toUpperCase()}</div>
              ${x.nat?`<div style="font-size:9px;color:#8B7355;letter-spacing:1px;margin-top:2px">NATURAL</div>`:""}
              ${x.rating?`<div style="font-size:13px;color:#c9a84c;margin-top:3px">${x.rating}★</div>`:""}
            </div>
          </div>
        </div>`;
      });
      out += `<div style="height:8px"></div>`;
    });
    main.innerHTML = out;
  }

  // ── DRUNK ──
  else if (state.tab === "drunk") {
    if (state.drunk.length === 0) {
      main.innerHTML = `<div style="text-align:center;color:#333;font-size:13px;margin-top:60px;line-height:2">No bottles logged yet.<br>Open a wine from your cellar and rate it.</div>`;
    } else {
      main.innerHTML = state.drunk.map(d=>`
        <div class="card" style="margin-top:8px">
          <div style="display:flex;justify-content:space-between;margin-bottom:4px">
            <span style="font-size:13px;color:#ede7db;flex:1;min-width:0;margin-right:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${d.name}</span>
            <span style="font-size:13px;color:#ede7db;flex-shrink:0">${"★".repeat(d.rating)}${"☆".repeat(5-d.rating)}</span>
          </div>
          <div style="font-size:11px;color:#444">${d.vintage} · ${d.date}</div>
          ${d.notes?`<div style="font-size:12px;color:#666;margin-top:6px">${d.notes}</div>`:""}
        </div>`).join("");
    }
    const h = document.createElement("div"); h.style.height = "16px";
    main.prepend(h);
  }

  app.appendChild(main);

  // Nav
  const nav = document.createElement("div");
  nav.className = "nav";
  [["dashboard","◉","Overview"],["cellar","▦","Cellar"],["intel","◈","Intel"],["radar","◬","Radar"],["drunk","◎","Drunk"]].forEach(([id,ic,lb])=>{
    const b = document.createElement("button");
    b.className = "navbtn" + (state.tab===id?" on":"");
    b.innerHTML = `<div class="ic">${ic}</div><div>${lb}</div>`;
    b.onclick = () => { state.tab=id; render(); };
    nav.appendChild(b);
  });
  app.appendChild(nav);
}

// ── Actions ──────────────────────────────────────────────────────────────────
function setSearch(v) { state.search=v; render(); }
function setFR(v) { state.fRegion=v; render(); }
function setFW(v) { state.fWindow=v; render(); }
function setFC(v) { state.fColour=v; render(); }
function requestGeo() {
  if (!navigator.geolocation) { state.geoStatus="denied"; render(); return; }
  state.geoStatus="loading"; render();
  navigator.geolocation.getCurrentPosition(
    pos => { state.userLat=pos.coords.latitude; state.userLng=pos.coords.longitude; state.geoStatus="ok"; render(); },
    () => { state.geoStatus="denied"; render(); },
    { timeout: 8000 }
  );
}
function setSort(v) {
  if (state.sort===v && (v==="vintage"||v==="value"||v==="price")) {
    state.sortDir = state.sortDir==="desc" ? "asc" : "desc";
  } else {
    state.sort=v; state.sortDir="desc";
  }
  render();
}
function setRating(n) { state.rating=n; render(); }
function back() { state.detail=null; state.rating=0; state.dNotes=""; render(); }

function openDetail(id) {
  state.detail = state.cellar.find(w=>w[I.ID]===id);
  state.rating = 0; state.dNotes = "";
  render();
}

function removeOne() {
  const w = state.detail;
  if (!w) return;
  state.cellar = state.cellar.map(x => x[I.ID]===w[I.ID] ? [...x.slice(0,I.Q), x[I.Q]-1, ...x.slice(I.Q+1)] : x).filter(x=>x[I.Q]>0);
  if (state.rating) {
    state.drunk.unshift({
      name: w[I.N], vintage: w[I.V],
      rating: state.rating, notes: state.dNotes,
      date: new Date().toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"})
    });
  }
  state.detail=null; state.rating=0; state.dNotes="";
  render();
}

render();
</script>
</body>
